<!doctype html>
<!--
  Study Live — digital study planner
  Discovery: deliverable = mobile-first student app (390px authoring, responsive to desktop)
  direction = warm university paper & stationery; ar (RTL) + ru + en; light/dark
  storage = localStorage (offline-first, no build step, no runtime network)
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Study Live</title>
    <meta name="description" content="Study Live — منصتك الرقمية لتنظيم مهامك الدراسية وملاحظاتك وفصولك. تطبيق PWA سريع، يعمل بدون إنترنت ويضمن خصوصية بياناتك." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://unpkg.com https://api-maps.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://api-maps.yandex.ru https://yastatic.net; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Study Live — Digital Study Planner" />
    <meta property="og:description" content="نظّم حياتك الدراسية بسهولة، مهامك اليومية، موادك، وكلمات سرك في مكان واحد" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://studylive.app" />
    
    <meta name="theme-color" content="#f7f2e9" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Leaflet (Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body>
    <div class="app">
      <header class="header"></header>
      <main class="main"></main>
      <button class="fab" hidden aria-label=""></button>
      <nav class="bottom-nav" aria-label="Study Live"></nav>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
